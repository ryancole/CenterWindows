name: Release

# push a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) to build
# the release exe and publish it as a github release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild CenterWindows.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" x64/Release/CenterWindows.exe --title "${{ github.ref_name }}" --generate-notes
